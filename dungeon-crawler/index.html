<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LLM Adventure Prototype</title>

  <!-- Retro font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />

  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    canvas {
      display: block;
      /* The secret sauce for a genuine pixel look */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Force DOM elements on top of the canvas with a nice pixel border */
    #game div {
      z-index: 10 !important;
    }

    #game {
      margin: 0 auto;
      display: block;
    }

    input {
      outline: none;
    }
  </style>
</head>
<body>
  <script>
    /* ================================
       Encounter Definitions
    ================================ */

    const ENCOUNTERS = [
      {
        id: 'cave',
        title: 'Ancient Cave',
        description: 'A damp cavern echoing with unseen movement.',
        background: 'bg_cave',
      },
      {
        id: 'volcano',
        title: 'Volcanic Chasm',
        description: 'Molten cracks glow beneath choking smoke.',
        background: 'bg_volcano',
      },
      {
        id: 'forest',
        title: 'Cursed Forest',
        description: 'Twisted trees whisper as shadows creep.',
        background: 'bg_forest',
      },
    ];

    /* ================================
       Mock LLM API (Replace Later)
    ================================ */

    async function mockLLM(prompt) {
      if (prompt.includes('Describe encounter')) {
        return {
          text:
            'The air is heavy and ancient.\n\n' +
            'From the shadows emerges a grotesque creature, its eyes glowing with malice.',
        };
      }

      if (prompt.includes('Player action')) {
        const dead = Math.random() > 0.6;
        return {
          text: dead
            ? 'Your blow strikes true. The creature collapses.\n\nMONSTER DEAD'
            : 'The monster recoils, wounded but furious.\n\nMONSTER ALIVE',
        };
      }

      return {
        text: 'Rusted Amulet — faintly warm to the touch.',
      };
    }

    /* ================================
       Game Scene
    ================================ */

    class GameScene extends Phaser.Scene {
      constructor() {
        super('GameScene');
      }

      create() {
        // Expose scene so the DOM button can call submitInput
        window.gameScene = this;

        this.state = {
          encounterIndex: 1,
          inventory: [],
          monsterDescription: '',
        };

        this.isBusy = false;

        /* Black background (no images needed) */
        this.background = this.add.graphics();
        this.background.fillStyle(0x000000, 1);
        this.background.fillRect(0, 0, 800, 600);

        /* Dialogue Panel (the classic retro box) */
        this.panel = this.add.graphics();
        this.panel.fillStyle(0x000000, 0.85);
        this.panel.fillRect(40, 340, 720, 220);
        this.panel.lineStyle(2, 0xffffff);
        this.panel.strokeRect(40, 340, 720, 220);

        /* Story log */
        this.storyLog = '';
        this.storyText = this.add.text(60, 360, '', {
          fontFamily: '"Press Start 2P"',
          fontSize: '14px',
          color: '#ffffff',
          wordWrap: { width: 680 },
        });

        /* Mask for scrolling inside the panel */
        const maskGraphics = this.make.graphics({});
        maskGraphics.fillRect(40, 340, 720, 220);
        this.storyText.setMask(maskGraphics.createGeometryMask());

        /* --- Input Row (DOM element, pixel‑perfect stylized) --- */
        this.inputRow = this.add.dom(400, 580, 'div', `
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          width: 720px;
        `, `
          <span style="
            color: white;
            font-family: 'Press Start 2P';
            font-size: 14px;
          ">></span>
          <input
            type="text"
            id="playerInput"
            placeholder="What do you do?"
            style="
              width: 560px;
              height: 30px;
              background: black;
              color: white;
              border: 2px solid white;
              font-family: 'Press Start 2P';
              font-size: 14px;
              padding: 0 8px;
              outline: none;
            "
          />
          <button
            onclick="window.gameScene.submitInput()"
            style="
              height: 34px;
              width: 60px;
              background: black;
              color: white;
              border: 2px solid white;
              font-family: 'Press Start 2P';
              font-size: 14px;
              cursor: pointer;
            "
          >▶</button>
        `);
        this.inputRow.setOrigin(0.5);

        // Hide initially, will appear after the first description
        this.setInputRowVisible(false);

        /* Keyboard submit (Enter) */
        this.input.keyboard.on('keydown-ENTER', () => {
          this.submitInput();
        });

        // Start the first adventure
        this.startEncounter();
      }

      // Show or hide the input row and manage focus
      setInputRowVisible(visible) {
        this.inputRow.setVisible(visible);
        if (visible) {
          this.time.delayedCall(30, () => {
            const inputEl = document.getElementById('playerInput');
            if (inputEl) inputEl.focus();
          });
        }
      }

      async startEncounter() {
        this.isBusy = true;
        this.setInputRowVisible(false);

        const encounter = Phaser.Utils.Array.GetRandom(ENCOUNTERS);
        this.currentEncounter = encounter;

        const res = await mockLLM(`
Describe encounter ${this.state.encounterIndex}.
Setting: ${encounter.title}
${encounter.description}
`);

        this.state.monsterDescription = res.text;

        this.appendTypewriter(
          `\n\n${encounter.description}\n\n${res.text}`,
          () => {
            this.isBusy = false;
            this.setInputRowVisible(true);
          }
        );
      }

      submitInput() {
        if (this.isBusy) return;

        const inputEl = document.getElementById('playerInput');
        if (!inputEl) return;

        const command = inputEl.value.trim();
        if (!command) return;

        inputEl.value = '';

        this.isBusy = true;
        this.setInputRowVisible(false);

        this.appendTypewriter(`\n\n> ${command}\n`, () => {
          this.handleAction(command);
        });
      }

      async handleAction(action) {
        const res = await mockLLM(`
Monster:
${this.state.monsterDescription}

Inventory:
${this.state.inventory.join(', ') || 'None'}

Player action:
"${action}"
`);

        this.appendTypewriter(res.text, async () => {
          if (res.text.includes('MONSTER DEAD')) {
            await this.handleReward();
          } else {
            this.isBusy = false;
            this.setInputRowVisible(true);
          }
        });
      }

      async handleReward() {
        const res = await mockLLM('reward');
        this.state.inventory.push(res.text);
        this.state.encounterIndex++;

        this.appendTypewriter(
          `\n\nVictory!\nReward gained: ${res.text}`,
          () => {
            this.isBusy = false;
            this.startEncounter();
          }
        );
      }

      appendTypewriter(text, onComplete) {
        let index = 0;

        this.time.addEvent({
          delay: 30,
          repeat: text.length - 1,
          callback: () => {
            this.storyLog += text[index++];
            this.storyText.setText(this.storyLog);

            const overflow = this.storyText.height - 220;
            if (overflow > 0) {
              this.storyText.y = 360 - overflow;
            }
          },
          onComplete,
        });
      }
    }

    /* ================================
       Phaser Game Config (pixel‑perfect retro)
    ================================ */
    new Phaser.Game({
      type: Phaser.AUTO,
      width: 800,
      height: 600,
      backgroundColor: '#000000',
      scene: GameScene,
      parent: 'game',
      dom: { createContainer: true },
      // The two settings that preserve the genuine pixel look
      pixelArt: true,
      roundPixels: true,
    });
  </script>

  <div id="game" style="position: relative; width: 800px; height: 600px; margin: auto;"></div>
</body>
</html>
