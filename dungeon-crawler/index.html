<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Language Gauntlet</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
    }

    #screen {
      position: relative;
      width: 800px;
      height: 600px;
      background: #0a0a0a;
      border: 4px solid #333;
      box-shadow:
        0 0 0 2px #555,
        0 0 40px 8px rgba(255, 202, 152, 0.15),
        inset 0 0 60px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    #screen::before {
      content: '';
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 200;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.18) 3px,
        rgba(0,0,0,0.18) 4px
      );
    }

    #screen::after {
      content: '';
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 199;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
    }

    #bg-image {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    #bg-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.62);
    }

    #titlebar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 36px;
      z-index: 10;
      background: rgba(13,13,13,0.9);
      border-bottom: 2px solid #f2ead3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f2ead3;
      font-size: 10px;
      letter-spacing: 3px;
      text-shadow: 0 0 8px #f2ead3;
    }

    #story-viewport {
      position: absolute;
      top: 44px;
      left: 16px; right: 16px;
      bottom: 80px;
      overflow: hidden;
      z-index: 10;
    }

    #story-text {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      color: #f2ead3;
      font-size: 11px;
      line-height: 2;
      text-shadow: 0 0 6px rgba(247, 255, 249, 0.7);
      white-space: pre-wrap;
      word-break: break-word;
    }

    #input-row {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 72px;
      z-index: 10;
      background: rgba(13,13,13,0.92);
      border-top: 2px solid #f2ead3;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
    }

    #prompt-arrow {
      color: #f2ead3;
      font-size: 14px;
      text-shadow: 0 0 8px #f2ead3;
      flex-shrink: 0;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #player-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid #f2ead3;
      color: #f2ead3;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 4px 6px;
      outline: none;
      caret-color: #f2ead3;
      text-shadow: 0 0 5px rgba(220, 231, 224, 0.6);
    }

    #player-input::placeholder {
      color: rgba(242,234,211,0.45);
      font-size: 10px;
    }

    #submit-btn {
      background: transparent;
      border: 2px solid #f2ead3;
      color: #f2ead3;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 6px 10px;
      cursor: pointer;
      text-shadow: 0 0 6px rgba(223, 240, 228, 0.6);
      box-shadow: 0 0 6px rgba(217, 233, 222, 0.2);
      transition: background 0.1s, box-shadow 0.1s;
    }

    #submit-btn:hover {
      background: rgba(242,234,211,0.08);
      box-shadow: 0 0 12px rgba(242,234,211,0.45);
    }

    #input-row.busy {
      opacity: 0.4;
      pointer-events: none;
    }

    /* ── START MENU ── */
    #start-menu {
      position: absolute;
      inset: 0;
      z-index: 150;
      background: rgba(0,0,0,0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 30px 40px;
    }

    #start-menu h1 {
      color: #f2ead3;
      font-size: 14px;
      letter-spacing: 4px;
      text-shadow: 0 0 16px #f2ead3;
      text-align: center;
      line-height: 2;
    }

    #start-menu p {
      color: rgba(242,234,211,0.7);
      font-size: 8px;
      text-align: center;
      line-height: 2.2;
      max-width: 640px;
    }

    .form-grid {
      width: 100%;
      max-width: 660px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 20px;
    }

    .field { display: flex; flex-direction: column; gap: 7px; }
    .field-full { grid-column: 1 / -1; }

    .field label {
      color: #f2ead3;
      font-size: 8px;
      letter-spacing: 1px;
      text-align: center;
    }

    .field input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 2px solid #f2ead3;
      color: #f2ead3;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 7px 6px;
      outline: none;
      caret-color: #f2ead3;
      text-align: center;
      text-shadow: 0 0 5px rgba(242,234,211,0.5);
    }

    .level-field { max-width: 140px; margin: 0 auto; grid-column: 1 / -1; }

    #start-btn {
      background: transparent;
      border: 2px solid #f2ead3;
      color: #f2ead3;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 9px 22px;
      cursor: pointer;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #f2ead3;
      box-shadow: 0 0 12px rgba(242,234,211,0.2);
      transition: background 0.15s, box-shadow 0.15s;
    }

    #start-btn:hover {
      background: rgba(242,234,211,0.1);
      box-shadow: 0 0 20px rgba(242,234,211,0.45);
    }

    /* ── HUD ── */
    #hud {
      position: absolute;
      top: 44px; left: 0; right: 0;
      height: 28px;
      z-index: 11;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(13,13,13,0.85);
      border-bottom: 1px solid rgba(242,234,211,0.3);
      gap: 12px;
    }

    .hud-label {
      color: #f2ead3;
      font-size: 7px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 10px;
      background: rgba(242,234,211,0.12);
      border: 1px solid rgba(242,234,211,0.3);
      position: relative;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      transition: width 0.5s ease;
    }

    #player-bar-fill { background: #6adf7e; }
    #monster-bar-fill { background: #df6a6a; }

    /* ── REWARD OVERLAY ── */
    #reward-overlay {
      position: absolute;
      inset: 0;
      z-index: 160;
      background: rgba(0,0,0,0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 30px;
    }

    #reward-overlay h2 {
      color: #f2ead3;
      font-size: 11px;
      letter-spacing: 3px;
      text-shadow: 0 0 12px #f2ead3;
      text-align: center;
    }

    #reward-overlay p.sub {
      color: rgba(242,234,211,0.6);
      font-size: 8px;
      text-align: center;
      line-height: 2;
    }

    .reward-cards {
      display: flex;
      gap: 14px;
      width: 100%;
      justify-content: center;
    }

    .reward-card {
      flex: 1;
      max-width: 200px;
      border: 2px solid rgba(242,234,211,0.5);
      padding: 12px 10px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .reward-card:hover {
      border-color: #f2ead3;
      background: rgba(242,234,211,0.07);
      box-shadow: 0 0 14px rgba(242,234,211,0.3);
    }

    .reward-card .r-rarity {
      color: rgba(242,234,211,0.5);
      font-size: 7px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .reward-card .r-name {
      color: #f2ead3;
      font-size: 8px;
      line-height: 1.7;
      text-shadow: 0 0 6px rgba(242,234,211,0.4);
    }

    .reward-card .r-desc {
      color: rgba(242,234,211,0.65);
      font-size: 7px;
      line-height: 1.8;
    }

    .reward-card .r-flavour {
      color: rgba(242,234,211,0.4);
      font-size: 6px;
      font-style: italic;
      line-height: 1.8;
      border-top: 1px solid rgba(242,234,211,0.2);
      padding-top: 6px;
    }

    /* ── STATUS CHIP ── */
    .status-chip {
      display: inline-block;
      border: 1px solid #df9f6a;
      color: #df9f6a;
      font-size: 7px;
      padding: 2px 6px;
      margin-left: 6px;
      text-shadow: 0 0 4px #df9f6a;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<div id="screen">
  <div id="bg-image"></div>

  <!-- START MENU -->
  <div id="start-menu">
    <h1>★ Language Gauntlet ★</h1>
    <p>Face ever-stronger monsters. Survive by wit and spoils.<br/>Your actions are validated — only the coherent survive.</p>

    <div class="form-grid">
      <div class="field field-full">
        <label for="char-desc-input">WHO ARE YOU?</label>
        <input id="char-desc-input" type="text" placeholder="e.g. a cunning child with a taste for danger" autocomplete="off" spellcheck="false" maxlength="60"/>
      </div>
      <div class="field">
        <label for="char-class-input">CLASS</label>
        <input id="char-class-input" type="text" placeholder="Warrior" autocomplete="off" spellcheck="false" maxlength="12"/>
      </div>
      <div class="field">
        <label for="char-race-input">RACE</label>
        <input id="char-race-input" type="text" placeholder="Elf" autocomplete="off" spellcheck="false" maxlength="12"/>
      </div>
      <div class="field level-field">
        <label for="char-level-input">LEVEL</label>
        <input id="char-level-input" type="number" value="1" min="1" max="20"/>
      </div>
    </div>

    <button id="start-btn" onclick="startGame()">► BEGIN ◄</button>
  </div>

  <!-- REWARD OVERLAY -->
  <div id="reward-overlay">
    <h2>★ CHOOSE YOUR REWARD ★</h2>
    <p class="sub">One item to carry forward. Choose wisely.</p>
    <div class="reward-cards" id="reward-cards"></div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <span class="hud-label">YOU</span>
    <div class="bar-track"><div class="bar-fill" id="player-bar-fill" style="width:100%"></div></div>
    <span class="hud-label" id="player-hp-label">100</span>
    &nbsp;&nbsp;
    <span class="hud-label" id="monster-name-label">MONSTER</span>
    <div class="bar-track"><div class="bar-fill" id="monster-bar-fill" style="width:100%"></div></div>
    <span class="hud-label" id="monster-hp-label">100</span>
  </div>

  <div id="titlebar">★ Language Gauntlet v2.0 ★</div>

  <div id="story-viewport">
    <div id="story-text"></div>
  </div>

  <div id="input-row">
    <span id="prompt-arrow">▶</span>
    <input id="player-input" type="text" placeholder="What do you do?" autocomplete="off" spellcheck="false"/>
    <button id="submit-btn" onclick="submitInput()">ENTER</button>
  </div>
</div>

<script>
/* ============================================================
   BACKGROUNDS
============================================================ */
let backgrounds = [
  // {
  //   path: 'https://images.unsplash.com/photo-1518562180175-34a163b1a9a6?w=800&q=80',
  //   name: 'Sunken Catacombs',

  //   mood: 'oppressive and damp'

  // {

  //   name: 'Twisted Forest',
  //   description: 'A dense, twisted forest where the canopy blots out all sunlight. Gnarled roots claw at the ground like frozen fingers. Something large moves between the trees.',

  // },
  // {
  //   path: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800&q=80',
  //   name: 'Frozen Pass',
  //   description: 'A jagged mountain pass scoured by freezing winds. Ice coats every surface. Far below, the valley is hidden by cloud.',
  //   mood: 'brutal and isolating'
  // },
  // {
  //   path: 'https://images.unsplash.com/photo-1504701954957-2010ec3bcec1?w=800&q=80',
  //   name: 'Volcanic Crater',
  //   description: 'The smouldering rim of a volcanic crater. Rivers of lava carve orange veins through black rock. The heat is almost unbearable.',
  //   mood: 'hellish and volatile'
  // },
  // {
  //   path: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&q=80',
  //   name: 'Abyssal Shore',
  //   description: 'A fog-shrouded shoreline where black waves crash against pale sand. The sea hides something vast and patient beneath its surface.',
  //   mood: 'eerie and vast'
  // },
];


// Function to fetch and append local images from JSON
async function appendLocalImages() {
  try {
    const response = await fetch('backgrounds.json');
    const localBackgrounds = await response.json();
    
    // Append each local entry to the existing `backgrounds` array
    backgrounds.push(...localBackgrounds);
    
    console.log(`Added ${localBackgrounds.length} local images. Total now: ${backgrounds.length}`);
    
    // If you have a renderizer function that displays the images,
    // call it again to refresh the UI with the updated list
    if (typeof renderizer === 'function') {
      renderizer();  // or pass the new `backgrounds` array if needed
    }
  } catch (error) {
    console.error('Failed to load local backgrounds:', error);
  }
}

// Call the function on startup
appendLocalImages();
/* ============================================================
   STATE MODEL
============================================================ */
const state = {
  phase: 'menu',
  // Player
  player: {
    description: '',
    race: '',
    class: '',
    level: 1,
    hp: 100,
    maxHp: 100,
    attributes: { strength: 10, dexterity: 10, constitution: 10, intelligence: 10, wisdom: 10, charisma: 10 },
    armor_class: 12,
    inventory: [],
    statusEffect: '',
  },
  // World
  world: {
    biome: null,
    encounterIndex: 0,
    totalEncounters: 4, // 3 normal + 1 boss
  },
  // Monster
  monster: null,
  // Combat
  combat: {
    turnNumber: 0,
    historyLog: [],
    lastOutcome: '',
  },
};

/* ============================================================
   PROMPT BUILDERS
============================================================ */

function buildCharacterPrompt() {
  return `Role: You are a professional D&D 5th Edition Dungeon Master and Systems Designer. Your task is to translate a character concept into a mechanically accurate 5e character sheet.

Input Variables:
Race: ${state.player.race}
Class: ${state.player.class}
Level: ${state.player.level}
Description: ${state.player.description}

Strict Rules for Generation:
Attributes: Use the Standard Array (15, 14, 13, 12, 10, 8). Assign these values based on the Class's primary needs and the provided Description. Apply Racial bonuses correctly.
Armor Class (AC): Calculate based on the most appropriate starting armor for the class + DEX modifier.

Output Format:
You MUST respond only with a valid JSON object following this exact structure:
{ "strength": "score", "dexterity": "score", "constitution": "score", "intelligence": "score", "wisdom": "score", "charisma": "score", "armor_class": "score" }`;
}

function buildMonsterPrompt(isBoss) {
  const biome = state.world.biome;
  const difficulty = state.world.encounterIndex;
  return `Act as an Enemy Designer and Game Master for a fantasy dungeon crawler video game. The game features a unique combat system called "Prompt Attack" where players attack by writing prompts describing their action, spell, or tactic.

Generate a complete enemy profile for the player to face. The rewards should be based on the monster, but be usable against other monsters.

Parameters:
- Biome/Environment: ${biome.name} — ${biome.description}
- Difficulty: ${difficulty} encounters completed so far
- Is_boss: ${isBoss ? 'Yes' : 'No'}
- Character class: ${state.player.class}
- Character description: ${state.player.description}

CRITICAL INSTRUCTION: Output ONLY valid JSON. No markdown, no extra text.

Use exactly this JSON structure:
{
  "name": "string",
  "boss": "${isBoss ? 'Yes' : 'No'}",
  "description": "A detailed paragraph describing its physical appearance, behavior, and origin. Include subtle hints about its weaknesses and strengths.",
  "strengths": ["element or concept it resists", "another strength"],
  "weaknesses": ["element or concept it is vulnerable to", "another weakness"],
  "intro": "1-2 sentence atmospheric introduction shown when the monster appears.",
  "hp": ${isBoss ? Math.min(60 + difficulty * 10, 120) : Math.min(30 + difficulty * 12, 80)},
  "reward_pool": [
    { "item_name": "string", "item_description": "short mechanical/thematic description", "flavour": "one eerie sentence", "rarity": "Common|Uncommon|Rare" },
    { "item_name": "string", "item_description": "short mechanical/thematic description", "flavour": "one eerie sentence", "rarity": "Common|Uncommon|Rare" },
    { "item_name": "string", "item_description": "short mechanical/thematic description", "flavour": "one eerie sentence", "rarity": "Common|Uncommon|Rare" }
  ]
}`;
}

function buildRoomNarrationPrompt() {
  const biome = state.world.biome;
  const monster = state.monster;
  const player = state.player;
  return `Role: You are an atmospheric Narrator and Dungeon Master for a dark fantasy adventure.

Objective: Narrate the current scene. Immerse the player in the environment and build tension about a potential threat WITHOUT revealing the enemy's name directly.

1. Environmental Sensory Input
- Describe lighting, architecture, atmosphere using the biome.
- Filter description through the player's class and race (e.g., a Rogue notices lack of footprints; a Paladin notices desecration).
- Describe how the monster appears and the general appearance.

2. End the narration at the "beat" before combat begins — the moment tension peaks.

INPUTS:
Player: Level ${player.level} ${player.race} ${player.class} — "${player.description}" — carrying: ${player.inventory.length ? player.inventory.map(i=>i.item_name).join(', ') : 'nothing'}
Biome: ${biome.name} — ${biome.description} — Mood: ${biome.mood}
Enemy hints (do NOT name it): ${monster.description}

Respond with ONLY the narration text, 3-5 sentences, no JSON, no labels. Do not think, just improvise.`;
}

function buildValidationPrompt(playerAction) {
  const player = state.player;
  const monster = state.monster;
  const biome = state.world.biome;
  const recentHistory = state.combat.historyLog.slice(-3).join('\n');

  return `You are a validation engine for a dungeon-style RPG game. Determine whether the player's declared action is coherent and possible.

You must ONLY return: true or false

INPUTS:
- player_action: "${playerAction}"
- player_context:
  - class: ${player.class}
  - race: ${player.race}
  - level: ${player.level}
  - description: ${player.description}
  - items: [${player.inventory.map(i => i.item_name).join(', ') || 'none'}]
  - status: "${player.statusEffect || 'none'}"
  - attributes: STR ${player.attributes.strength}, DEX ${player.attributes.dexterity}, INT ${player.attributes.intelligence}, WIS ${player.attributes.wisdom}, CHA ${player.attributes.charisma}

- Current biome: ${biome.name} — ${biome.description}
- Enemy: ${monster.name} — ${monster.description}
- Recent combat history:\n${recentHistory || 'none yet'}

VALIDATION RULES:
1. Attempting the action must be physically and narratively possible within the established fantasy setting.
2. Player CANNOT use items not in their inventory.
3. Player CANNOT cast spells or use powers not supported by their class/attributes.
4. Player CAN use held items creatively, describe physical actions, improvise with the environment.
5. Be permissive with creativity if the action is plausible.
6. Reject actions that contradict prior round summaries.
7. Assume medieval fantasy setting unless context states otherwise.
8. Magical actions should be constrained by the typical limitations of a Dungeons and Dragons setting. Use the character level for guidance on what is reasonable.

OUTPUT FORMAT — Return ONLY this JSON:
{
  "reason": "Short reason for the validation decision",
  "valid": true | false,
}

IMPORTANT: Output must be valid JSON only. No markdown. No explanations outside the JSON.`;
}

function buildCombatPrompt(playerAction) {
  const player = state.player;
  const monster = state.monster;
  const biome = state.world.biome;
  const recentHistory = state.combat.historyLog.slice(-4).join('\n');

  return `You are the combat resolution engine for a dungeon-style RPG video game.

Evaluate the player's action and determine:
- How effective the action is against the enemy
- How much damage the player deals
- How much damage the player receives
- A short immersive combat narration
- A brief round summary for memory

INPUTS:
- player_action: "${playerAction}"
- player_context:
  - race: ${player.race}, class: ${player.class}, level: ${player.level}
  - description: ${player.description}
  - items: [${player.inventory.map(i => i.item_name).join(', ') || 'none'}]
  - attributes: STR ${player.attributes.strength}, DEX ${player.attributes.dexterity}, INT ${player.attributes.intelligence}
  - armor_class: ${player.armor_class}
  - status: "${player.statusEffect || 'none'}"
- biome: ${biome.name} — ${biome.description}
- enemy:
  - name: ${monster.name}
  - boss: ${monster.boss}
  - description: ${monster.description}
  - strengths: ${JSON.stringify(monster.strengths)}
  - weaknesses: ${JSON.stringify(monster.weaknesses)}
  - hp remaining: ${monster.hp}/${monster.maxHp}
- player_hp_remaining: ${player.hp}/100
- recent_combat_history:\n${recentHistory || 'Turn 1 — no prior history.'}

COMBAT RULES:
1. Strongly reward clever tactics, exploiting weaknesses, environmental usage, item synergy.
2. Penalize ignoring obvious weaknesses, ineffective attacks, impossible actions.
3. Damage values — damage_dealt: 0-40, damage_received: 0-30 (bosses hit harder).
4. High damage should feel earned. Weak prompts deal little and may increase incoming damage.
5. The enemy may counterattack based on the quality of the player's action.
6. Keep narration concise and immersive (2-3 sentences).
7. round_summary: 1 sentence factual combat summary for memory.

OUTPUT FORMAT — Return ONLY this JSON:
{
  "outcome": "Short immersive narration of the result of the player's action and the enemy's response",
  "damage_dealt": integer,
  "damage_received": integer,
  "status": "status effect name or empty string",
  "round_summary": "brief factual summary",
  "result": "ongoing" | "player_wins" | "monster_wins"
}

IMPORTANT: Output must be valid JSON only. No markdown. No explanations outside the JSON.`;
}

function buildVictoryNarrationPrompt(reward) {
  const player = state.player;
  const monster = state.monster;
  const biome = state.world.biome;

  return `Role: You are an atmospheric Narrator and Dungeon Master.

Objective: Narrate the immediate aftermath of combat. Transition from the heat of battle to the cold reality of the environment.

1. The Reveal: The enemy is now dead. Describe it fully — its appearance in death, the damage from the final blow.
2. The Physical Toll: Reference the player's condition based on HP (${player.hp}/100). Mention any status effects: "${player.statusEffect || 'none'}".
3. Environmental Shift: How has the environment changed? Blood, scorch marks, silence?
4. Tone: A near-death victory feels harrowing and lucky. A clean victory feels gritty but empowering.

INPUTS:
Player: Level ${player.level} ${player.race} ${player.class} — "${player.description}"
Biome: ${biome.name} — ${biome.description}
Enemy: ${monster.name} — ${monster.description}
Last outcome: ${state.combat.lastOutcome}

Respond with ONLY narration text, 1-3 sentences. No JSON, no labels, no markdown.`;
}

/* ============================================================
   LLM INTERFACE
============================================================ */
async function llmResponse(prompt) {
  console.groupCollapsed('[LLM PROMPT]');
  console.log(prompt);
  console.groupEnd();

  let attempts = 0;

  const res = await fetch('/api/llm', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ prompt }),
  });

  const data = await res.json();
  if (!res.ok) {
    console.error('API error:', data);
    throw new Error(data.error?.message || 'API failed');
  }

  const rawText = data.content || '';
  console.groupCollapsed('[LLM RAW OUTPUT]');
  console.log(rawText);
  console.groupEnd();

  return rawText;
}

async function llmJSON(prompt) {
  let attempts = 0;
  let not_finished = true;

  while (attempts < 3 && not_finished) {
    try {
      const json = await llmResponse(prompt);
      out = parseJsonSafe(json);
      not_finished = false;
      return out;
    } catch (e) {
      console.warn('LLM JSON parse failed, retrying...', e);
      attempts++;
    }
    const raw = await llmResponse(prompt);
    return parseJsonSafe(raw);
  }
}

function parseJsonSafe(text) {
  const cleaned = text.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
  // Try direct parse
  try { return JSON.parse(cleaned); } catch(_) {}
  // Extract first JSON object
  const start = cleaned.indexOf('{');
  const end   = cleaned.lastIndexOf('}');
  if (start !== -1 && end > start) {
    try { return JSON.parse(cleaned.slice(start, end + 1)); } catch(_) {}
  }
  // Try extracting JSON array
  const aStart = cleaned.indexOf('[');
  const aEnd   = cleaned.lastIndexOf(']');
  if (aStart !== -1 && aEnd > aStart) {
    try { return JSON.parse(cleaned.slice(aStart, aEnd + 1)); } catch(_) {}
  }
  console.error('JSON parse failed on:', text);
  throw new Error('Invalid JSON from LLM');
}

/* ============================================================
   TYPEWRITER ENGINE
============================================================ */
const storyEl  = document.getElementById('story-text');
const inputRow = document.getElementById('input-row');
const inputEl  = document.getElementById('player-input');

let storyLog   = '';
let isBusy     = false;
let typeQueue  = [];
let typing     = false;

function setBusy(busy) {
  isBusy = busy;
  inputRow.classList.toggle('busy', busy);
  if (!busy) inputEl.focus();
}

function typeWrite(text, onDone) {
  typeQueue.push({ text, onDone });
  if (!typing) drainQueue();
}

function drainQueue() {
  if (!typeQueue.length) { typing = false; return; }
  typing = true;
  const { text, onDone } = typeQueue.shift();
  let i = 0;
  const iv = setInterval(() => {
    if (i >= text.length) {
      clearInterval(iv);
      if (onDone) onDone();
      drainQueue();
      return;
    }
    storyLog += text[i++];
    storyEl.textContent = storyLog;
    if (storyEl.offsetHeight > storyEl.parentElement.offsetHeight) {
      storyEl.style.top = 'auto';
      storyEl.style.bottom = '0';
    }
  }, 22);
}

function print(text, cb) { typeWrite(text + '\n', cb); }

function delay(ms) { return new Promise(res => setTimeout(res, ms)); }

function typeAsync(text) {
  return new Promise(res => typeWrite(text, res));
}


/* ============================================================
   MUSIC MANAGER
============================================================ */
const music = (() => {
  const tracks = {
    standard: [
      'standard_battle_1.wav',
      'standard_battle_2.wav',
      'standard_battle_3.wav',
      'standard_battle_4.wav',
      'standard_battle_5.wav',
    ],
    boss: [
      'boss_battle_1.wav',
      'boss_battle_2.wav',
      'boss_battle_3.wav',
    ],
  };

  // Track last played index per type
  const lastPlayed = {
    standard: -1,
    boss: -1,
  };

  let audio = null;
  let currentType = null;

  function getRandomTrack(type) {
    const list = tracks[type];
    if (!list || !list.length) return null;

    // If only one track exists, use it
    if (list.length === 1) {
      return `/music/${type}/${list[0]}`;
    }

    let index;

    // Keep rolling until different from previous
    do {
      index = Math.floor(Math.random() * list.length);
    } while (index === lastPlayed[type]);

    lastPlayed[type] = index;

    return `/music/${type}/${list[index]}`;
  }

  function play(type) {
    stop();

    const src = getRandomTrack(type);
    if (!src) return;

    currentType = type;

    audio = new Audio(src);
    audio.volume = 0.5;

    // Play another random track when finished
    audio.onended = () => play(type);

    audio.play().catch(e => {
      console.warn('Music play failed:', e);
    });
  }

  function stop() {
    if (audio) {
      audio.onended = null;
      audio.pause();
      audio.src = '';
      audio = null;
    }

    currentType = null;
  }

  return { play, stop };
})();

}

function updateHUD() {
  const p = state.player;
  const m = state.monster;
  const pPct = Math.max(0, (p.hp / p.maxHp) * 100);
  const mPct = m ? Math.max(0, (m.hp / m.maxHp) * 100) : 100;
  document.getElementById('player-bar-fill').style.width  = pPct + '%';
  document.getElementById('monster-bar-fill').style.width = mPct + '%';
  document.getElementById('player-hp-label').textContent  = Math.max(0, p.hp);
  document.getElementById('monster-hp-label').textContent = m ? Math.max(0, m.hp) : '?';
  document.getElementById('player-bar-fill').style.background =
    pPct > 50 ? '#6adf7e' : pPct > 25 ? '#dfcc6a' : '#df6a6a';
}

function showRewardOverlay(rewardPool, onChoice) {
  const overlay = document.getElementById('reward-overlay');
  const cards   = document.getElementById('reward-cards');
  cards.innerHTML = '';

  rewardPool.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'reward-card';
    card.innerHTML = `
      <div class="r-rarity">${item.rarity || 'Common'}</div>
      <div class="r-name">${item.item_name}</div>
      <div class="r-desc">${item.item_description}</div>
      <div class="r-flavour">"${item.flavour}"</div>
    `;

      overlay.style.display = 'none';
      onChoice(item);
    });
    cards.appendChild(card);
  });

  overlay.style.display = 'flex';
}

/* ============================================================
   GAME FLOW
============================================================ */

function startGame() {
  const desc        = document.getElementById('char-desc-input').value.trim() || 'a wandering soul';
  const playerClass = document.getElementById('char-class-input').value.trim() || 'Warrior';
  const race        = document.getElementById('char-race-input').value.trim()  || 'Human';
  const level       = parseInt(document.getElementById('char-level-input').value) || 1;

  state.player.description = desc;
  state.player.class       = playerClass;
  state.player.race        = race;
  state.player.level       = level;
  state.player.hp          = 100;
  state.player.maxHp       = 100;
  state.player.inventory   = [];
  state.player.statusEffect = '';
  state.world.encounterIndex = 0;
  state.world.biome = backgrounds[Math.floor(Math.random() * backgrounds.length)];
  state.combat.historyLog = [];

  document.getElementById('start-menu').style.display = 'none';
  state.phase = 'loading';

  // Generate character sheet async (non-blocking — apply when ready)
  generateCharacterSheet();

  runEncounterLoop();
}

async function generateCharacterSheet() {
  try {
    const prompt = buildCharacterPrompt();
    const sheet = await llmJSON(prompt);
    // Apply attributes and AC from sheet
    console.groupCollapsed('Generated Sheet');
    console.dir(sheet, { depth: null });
    console.groupEnd();

    // Apply attributes and AC from sheet
    if (sheet) {
      const previousAttributes = { ...state.player.attributes };

      state.player.attributes = {
        strength:     sheet.strength     || 10,
        dexterity:    sheet.dexterity    || 10,
        constitution: sheet.constitution || 10,
        intelligence: sheet.intelligence || 10,
        wisdom:       sheet.wisdom       || 10,
        charisma:     sheet.charisma     || 10,
      };

      console.groupCollapsed('Attributes Applied');
      console.table({
        previous: previousAttributes,
        generated: sheet,
        final: state.player.attributes,
      });
      console.groupEnd();
    } else {
      console.warn('No attributes returned from character sheet');
    }

    if (sheet.armor_class) {
      const previousAC = state.player.armor_class;
      state.player.armor_class = sheet.armor_class;

      console.log('Armor Class Updated', {
        previous: previousAC,
        generated: sheet.armor_class,
        final: state.player.armor_class,
      });
    } else {
      console.warn('No armor_class returned from character sheet');
    }

    console.groupEnd();

  } catch (e) {
    console.groupCollapsed('%c[Character Generation Failed]', 'color:#ef4444;font-weight:bold');
    console.warn('Character sheet generation failed, using defaults:', e);
    console.groupEnd();
  }
}

document.getElementById('char-desc-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') startGame();
});

async function runEncounterLoop() {
  setBusy(true);
  clearBackground();

  const biome = state.world.biome;
  const isBoss = state.world.encounterIndex >= state.world.totalEncounters - 1;

  // Reset combat state
  state.combat.turnNumber = 0;
  state.combat.historyLog = [];
  state.combat.lastOutcome = '';
  state.player.hp = state.player.maxHp;
  state.player.statusEffect = '';

  storyLog = '';
  storyEl.textContent = '';

  setBackground(biome);
  await delay(400);

  music.play(isBoss ? 'boss' : 'standard');

  const encounterNum = state.world.encounterIndex + 1;
  await typeAsync(`\n${isBoss ? `★★ BOSS ENCOUNTER - ${biome.name.toUpperCase()} ★★` : `★ ENCOUNTER ${encounterNum} - ${biome.name.toUpperCase()} ★`}\n`);
  await typeAsync('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n');

  // Generate monster
  await typeAsync('You press onwards...\n\n');
  let monsterData;
  try {
    const prompt = buildMonsterPrompt(isBoss);
    monsterData = await llmJSON(prompt);
  } catch(e) {
    console.error('Monster generation failed:', e);
    monsterData = {
      name: isBoss ? 'Ancient Horror' : 'Cave Troll',
      boss: isBoss ? 'Yes' : 'No',
      description: 'A hulking, ancient creature of considerable menace.',
      strengths: ['brute force', 'darkness'],
      weaknesses: ['fire', 'light magic'],
      intro: 'A monstrous shape looms from the shadows — eyes fixed on you with cold intent.',
      hp: isBoss ? 80 : 40,
      reward_pool: [
        { item_name: 'Troll Fang', item_description: 'Adds force to melee attacks', flavour: 'Still warm from the kill.', rarity: 'Common' },
        { item_name: 'Shadow Cloak', item_description: 'Reduces incoming damage from darkness attacks', flavour: 'Absorbs the light around you.', rarity: 'Uncommon' },
        { item_name: 'Stone Heart', item_description: 'Increases resilience against physical blows', flavour: 'Heavy as regret.', rarity: 'Rare' },
      ]
    };
  }

  state.monster = {
    name:        monsterData.name,
    boss:        monsterData.boss,
    description: monsterData.description,
    strengths:   monsterData.strengths  || [],
    weaknesses:  monsterData.weaknesses || [],
    hp:          monsterData.hp,
    maxHp:       monsterData.hp,
    reward_pool: monsterData.reward_pool || [],
  };

  showHUD(monsterData.name);

  // Room narration
  let narration = '';
  try {
    narration = await llmResponse(buildRoomNarrationPrompt());
  narration = narration
    // Remove markdown code blocks
    .replace(/```[\s\S]*?```/g, '')

    // Remove <think>...</think> blocks
    .replace(/<think>[\s\S]*?<\/think>/gi, '')

    // Remove common "Thinking..." style prefixes
    .replace(/^\s*thinking\.\.\..*$/gim, '')
    .replace(/^\s*thoughts?:.*$/gim, '')

    .trim();
  } catch(e) {
    narration = monsterData.intro;
  }

  await typeAsync(narration + '\n\n');

  await typeAsync(`[ ${monsterData.name.toUpperCase()} ]`);
  if (isBoss) await typeAsync(' ⚠ BOSS');
  await typeAsync(`\n`);
  
  state.phase = 'encounter';
  inputEl.placeholder = 'What do you do?';
  setBusy(false);
}

async function handleCombatAction(action) {
  setBusy(true);

  await typeAsync(`\n> ${action}\n\n`);

  // ── VALIDATION ──
  let isValid = true;
  let reason = '';  
  try {
    const validationPrompt = buildValidationPrompt(action);
    const validationData    = await llmJSON(validationPrompt);
    isValid = validationData.valid === true;
    reason = validationData.reason || 'No reason provided';
  } catch(e) {
    console.warn('Validation failed, defaulting to valid:', e);
    isValid = true;
  }

  if (!isValid) {
    await typeAsync(`⚠ ${reason}\n\n`);
    setBusy(false);
    return;
  }

  // ── COMBAT RESOLUTION ──
  let result;
  try {
    const combatPrompt = buildCombatPrompt(action);
    result = await llmJSON(combatPrompt);
  } catch(e) {
    console.error('Combat resolution failed:', e);
    result = {
      outcome: `You press the attack. The ${state.monster.name} staggers but retaliates viciously.`,
      damage_dealt:   Math.floor(Math.random() * 20) + 5,
      damage_received: Math.floor(Math.random() * 15),
      status: '',
      round_summary: `Player attacked ${state.monster.name}. Exchange of blows.`,
      result: 'ongoing',
    };
  }

  // Apply damage
  const dmgDealt    = Math.min(result.damage_dealt    || 0, 40);
  const dmgReceived = Math.min(result.damage_received || 0, 30);
  state.monster.hp  -= dmgDealt;
  state.player.hp   -= dmgReceived;
  state.combat.turnNumber++;

  if (result.status) state.player.statusEffect = result.status;
  state.combat.lastOutcome = result.outcome || '';

  // Store round summary in history
  if (result.round_summary) {
    state.combat.historyLog.push(`Turn ${state.combat.turnNumber}: ${result.round_summary}`);
    if (state.combat.historyLog.length > 6) state.combat.historyLog.shift();
  }

  updateHUD();

  await typeAsync((result.outcome || '') + '\n');
  if (dmgDealt    > 0) await typeAsync(`  You deal ${dmgDealt} damage. (${state.monster.name}: ${Math.max(0, state.monster.hp)} HP)\n`);
  if (dmgReceived > 0) await typeAsync(`  You take ${dmgReceived} damage. (You: ${Math.max(0, state.player.hp)} HP)\n`);
  if (result.status) await typeAsync(`  Status: [${result.status.toUpperCase()}]\n`);
  await typeAsync('\n');

  // Check outcome
  const win  = result.result === 'player_wins' || state.monster.hp <= 0;
  const lose = result.result === 'monster_wins' || state.player.hp <= 0;

  if (win)       { await handleVictory(); }
  else if (lose) { await handleDeath(); }
  else           { setBusy(false); }
}

async function handleVictory() {
  hideHUD();
  music.stop();
  const monster = state.monster;
  const biome   = state.world.biome;
  const isBoss  = state.world.encounterIndex >= state.world.totalEncounters - 1;

  await typeAsync(`★ VICTORY! ${monster.name} has fallen! ★\n\n`);

  // Victory narration
  try {
    const narration = await llmResponse(buildVictoryNarrationPrompt(null));
    await typeAsync(narration.replace(/```[\s\S]*?```/g, '').trim() + '\n\n');
  } catch(e) {
    await typeAsync(`The ${monster.name} crumbles. Silence returns to ${biome.name}.\n\n`);
  }

  // Show reward overlay
  const rewardPool = monster.reward_pool && monster.reward_pool.length >= 3
    ? monster.reward_pool
    : [
        { item_name: 'Monster Essence', item_description: 'A lingering power from the fallen foe', flavour: 'It hums with residual will.', rarity: 'Common' },
        { item_name: 'Blood Token',     item_description: 'Intimidates weaker enemies on sight',   flavour: 'Stained but unbroken.',        rarity: 'Common' },
        { item_name: 'Void Shard',      item_description: 'Cleaves through magical defenses',      flavour: 'Cold to the touch, always.',   rarity: 'Rare'   },
      ];

  setBusy(false);

  showRewardOverlay(rewardPool, async (chosenItem) => {
    setBusy(true);
    state.player.inventory.push(chosenItem);

    await typeAsync(`  [ ITEM GAINED: ${chosenItem.item_name} ]\n`);
    await typeAsync(`  "${chosenItem.flavour}"\n\n`);
    await typeAsync(`Inventory: ${state.player.inventory.map(i => i.item_name).join(' | ')}\n\n`);

    if (isBoss) {
      // End of run — biome complete
      await typeAsync('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n');
      await typeAsync('★★ THE BIOME IS CONQUERED ★★\n\n');
      await typeAsync(`Encounters survived: ${state.world.encounterIndex + 1}\n`);
      await typeAsync(`Items collected: ${state.player.inventory.length}\n\n`);
      await typeAsync('Type RESTART to begin a new run.\n');
      inputEl.placeholder = 'Type RESTART...';
      state.phase = 'dead';
      setBusy(false);
    } else {
      state.world.encounterIndex++;
      state.phase = 'reward';
      inputEl.placeholder = 'Press ENTER to advance...';
      setBusy(false);
    }
  });
}

async function handleDeath() {
  hideHUD();
  clearBackground();
  state.phase = 'dead';
  music.stop();
  await typeAsync('\n\n');
  await typeAsync('★ ★ ★  GAME OVER  ★ ★ ★\n\n');
  await typeAsync(`You fell to the ${state.monster.name}.\n`);
  await typeAsync(`Encounters survived: ${state.world.encounterIndex}\n`);
  await typeAsync(`Items collected:     ${state.player.inventory.length ? state.player.inventory.map(i => i.item_name).join(', ') : 'none'}\n\n`);
  await typeAsync('Type RESTART to play again.\n');

  inputEl.placeholder = 'Type RESTART...';
  setBusy(false);
}

/* ============================================================
   INPUT HANDLING
============================================================ */
function submitInput() {
  if (isBusy) return;
  const raw = inputEl.value.trim();
  inputEl.value = '';

  if (state.phase === 'reward') {
    runEncounterLoop();
    return;
  }

  if (state.phase === 'dead') {
    if (raw.toLowerCase() === 'restart') {
      document.getElementById('char-desc-input').value = '';
      document.getElementById('start-menu').style.display = 'flex';
      state.phase = 'menu';
    }
    return;
  }


  if (!raw) return;

  if (state.phase === 'encounter') {
    handleCombatAction(raw);
  }
}

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') submitInput();
});
