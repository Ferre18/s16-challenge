<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Retro Adventure</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
    }

    /* ── Outer CRT shell ── */
    #screen {
      position: relative;
      width: 800px;
      height: 600px;
      background: #0a0a0a;
      border: 4px solid #333;
      box-shadow:
        0 0 0 2px #555,
        0 0 40px 8px rgba(255, 202, 152, 0.15),
        inset 0 0 60px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* CRT scanline overlay */
    #screen::before {
      content: '';
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 100;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.18) 3px,
        rgba(0,0,0,0.18) 4px
      );
    }

    /* CRT phosphor glow vignette */
    #screen::after {
      content: '';
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 99;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
    }

    /* ── Title bar ── */
    #titlebar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 36px;
      background: #0d0d0d;
      border-bottom: 2px solid #f2ead3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f2ead3;
      font-size: 10px;
      letter-spacing: 3px;
      text-shadow: 0 0 8px #00ff66;
    }

    /* ── Story viewport ── */
    #story-viewport {
      position: absolute;
      top: 44px;
      left: 16px; right: 16px;
      bottom: 80px;
      overflow: hidden;
    }

    #story-text {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      color: #f2ead3;
      font-size: 11px;
      line-height: 2;
      text-shadow: 0 0 6px rgba(247, 255, 249, 0.7);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Input row ── */
    #input-row {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 72px;
      background: #0d0d0d;
      border-top: 2px solid #f2ead3;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
    }

    #prompt-arrow {
      color: #f2ead3;
      font-size: 14px;
      text-shadow: 0 0 8px #f2ead3;
      flex-shrink: 0;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #player-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid #f2ead3;
      color: #f2ead3;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 4px 6px;
      outline: none;
      caret-color: #f2ead3;
      text-shadow: 0 0 5px rgba(220, 231, 224, 0.6);
    }

    #player-input::placeholder {
      color: #f2ead3;
      font-size: 10px;
    }

    #submit-btn {
      background: transparent;
      border: 2px solid #f2ead3;
      color: #f2ead3;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 6px 10px;
      cursor: pointer;
      text-shadow: 0 0 6px rgba(223, 240, 228, 0.6);
      box-shadow: 0 0 6px rgba(217, 233, 222, 0.2);
      transition: background 0.1s, box-shadow 0.1s;
    }

    #submit-btn:hover {
      background: rgba(0,255,80,0.08);
      box-shadow: 0 0 12px rgba(217, 235, 222, 0.45);
    }

    /* Busy state dims the input */
    #input-row.busy {
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="screen">
  <div id="titlebar">★ RETRO ADVENTURE v1.0 ★</div>

  <div id="story-viewport">
    <div id="story-text"></div>
  </div>

  <div id="input-row">
    <span id="prompt-arrow">▶</span>
    <input id="player-input" type="text" placeholder="What do you do?" autocomplete="off" spellcheck="false" />
    <button id="submit-btn" onclick="submitInput()">ENTER</button>
  </div>
</div>

<script>
/* ================================================
   GAME STATE
================================================ */
let gameState;

function resetGameState() {
  gameState = {
    currentRoom: 'cell',
    inventory: [],
    rooms: {
      cell: {
        description: 'You are in a cold prison cell. A heavy wooden door leads NORTH.',
        exits: { north: 'hallway' },
        items: ['key']
      },
      hallway: {
        description: 'A torchlit hallway stretches EAST and WEST. The cell door is SOUTH.',
        exits: { south: 'cell', east: 'treasure_room', west: 'abyss' },
        items: []
      },
      treasure_room: {
        description: 'This room glitters with gold! The exit is WEST.',
        exits: { west: 'hallway' },
        items: ['crown', 'sword']
      },
      abyss: {
        description: 'You stand at the edge of a bottomless pit. Cold wind rises from below. The only way is back EAST.',
        exits: { east: 'hallway' },
        items: []
      }
    }
  };
}

/* ================================================
   MOCK LLM  (swap this function for a real API call)
================================================ */
function mockLLM(input) {
  const cmd   = input.toLowerCase().trim();
  const words = cmd.split(' ');
  const verb  = words[0];
  const noun  = words.slice(1).join(' ');

  if (verb === 'help')
    return 'Commands: look, go [dir], take [item], inventory, help';
  if (verb === 'look' || cmd === 'l')
    return look();
  if (verb === 'inventory' || cmd === 'i')
    return showInventory();
  if (verb === 'go' || verb === 'walk' || verb === 'move')
    return noun ? movePlayer(noun) : 'Go where? (north, south, east, west)';
  if (verb === 'take' || verb === 'get' || verb === 'pick')
    return noun ? takeItem(noun) : 'Take what?';
  if (verb === 'use')
    return `You try to use the ${noun}, but nothing happens.`;
  if (verb === 'drop')
    return `You decide to keep the ${noun} for now.`;

  const generic = [
    `You ponder the meaning of "${input}".`,
    'A voice in the darkness whispers... "Interesting."',
    'That action has no visible effect.',
    'The stone walls stare back blankly.',
    'Perhaps try: look, go [dir], take [item], inventory.'
  ];
  return generic[Math.floor(Math.random() * generic.length)];
}

function look() {
  const room = gameState.rooms[gameState.currentRoom];
  let desc = room.description;
  if (room.items.length) desc += `\nYou see: ${room.items.join(', ')}.`;
  return desc;
}
function showInventory() {
  return gameState.inventory.length
    ? 'You carry: ' + gameState.inventory.join(', ') + '.'
    : 'You are carrying nothing.';
}
function movePlayer(dir) {
  const exit = gameState.rooms[gameState.currentRoom].exits[dir];
  if (!exit) return `You cannot go ${dir} from here.`;
  gameState.currentRoom = exit;
  return look();
}
function takeItem(name) {
  const room = gameState.rooms[gameState.currentRoom];
  const idx  = room.items.indexOf(name);
  if (idx === -1) return `There is no ${name} here.`;
  room.items.splice(idx, 1);
  gameState.inventory.push(name);
  return `You take the ${name}.`;
}

/* ================================================
   TYPEWRITER ENGINE
================================================ */
const storyEl   = document.getElementById('story-text');
const inputRow  = document.getElementById('input-row');
const inputEl   = document.getElementById('player-input');

let   storyLog  = '';
let   isBusy    = false;
let   typeQueue = [];
let   typing    = false;

function setBusy(busy) {
  isBusy = busy;
  inputRow.classList.toggle('busy', busy);
  if (!busy) inputEl.focus();
}

function appendLog(chunk) {
  storyLog += chunk;
}

function typeWrite(text, onDone) {
  typeQueue.push({ text, onDone });
  if (!typing) drainQueue();
}

function drainQueue() {
  if (!typeQueue.length) { typing = false; return; }
  typing = true;
  const { text, onDone } = typeQueue.shift();
  let i = 0;
  const interval = setInterval(() => {
    if (i >= text.length) {
      clearInterval(interval);
      if (onDone) onDone();
      drainQueue();
      return;
    }
    appendLog(text[i++]);
    storyEl.textContent = storyLog;
    // Keep text anchored at the bottom of the viewport
    const vp = storyEl.parentElement;
    if (storyEl.offsetHeight < vp.offsetHeight) {
      storyEl.style.bottom = '0';
    } else {
      storyEl.style.bottom = '0';
      storyEl.style.position = 'absolute';
    }
  }, 28);
}

/* ================================================
   PLAYER INPUT
================================================ */
function submitInput() {
  if (isBusy) return;
  const cmd = inputEl.value.trim();
  if (!cmd) return;
  inputEl.value = '';

  setBusy(true);

  typeWrite(`\n> ${cmd}\n`, () => {
    const response = mockLLM(cmd);
    typeWrite(response + '\n', () => {
      setBusy(false);
    });
  });
}

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') submitInput();
});

/* ================================================
   BOOT SEQUENCE
================================================ */
resetGameState();

const intro = [
  '★ RETRO ADVENTURE ★\n',
  '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n',
  'You awake in a dim stone chamber.\n',
  'Dusty air. Cold floor. A single torch flickers on the wall,\n',
  'revealing a door to the NORTH. A rusty KEY lies on the ground.\n\n',
  'Commands: look, go [dir], take [item], inventory, help\n\n',
  '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n',
];

setBusy(true);

let seq = Promise.resolve();
intro.forEach(line => {
  seq = seq.then(() => new Promise(res => typeWrite(line, res)));
});
seq.then(() => setBusy(false));
</script>
</body>
</html>
